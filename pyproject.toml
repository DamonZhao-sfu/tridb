[tool.ruff]
target-version = "py312"
line-length = 88
# Not project source: experiment outputs, archived snapshots, vendored or third-party
# checkouts, and frozen per-run source snapshots kept for reproducibility. Linting or
# reformatting them would either be meaningless (generated) or would rewrite archived
# artifacts. `make lint` covers the project code only.
extend-exclude = [
    "results",
    "gem_evotrace_archive",
    "deliverables",
    "third_party",
    "FluctlightDB",
    "PolyMemDB",
    "LongMemEval-V2",
    "EvoMemBench",
    "syftr",
    "dataset",
    "data",
    "cache",
    "exg/vendor",
    "exg/results",
    "experiments/ranzcr_session_cursor_v1",
    "experiments/traceml_aes2_m10_h20_c20",
    ".pgprefix16",
    ".tridb-pgdata-*",
]
